
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slideshow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin: 35px 0 10px;
    }

    .subtitle {
      color: #666;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .slideshow {
      width: 85%;
      max-width: 1100px;
      margin: auto;
      position: relative;
    }

    .main-image {
      width: 100%;
      height: 550px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.15);
      display: block;
    }




 

    @media (max-width: 700px) {
      h1 {
        font-size: 30px;
      }

      .slideshow, .thumbnails {
        width: 90%;
      }

      .main-image {
        height: 350px;
      }

    }
  </style>
</head>

<body>

  <h1>Image Slideshow</h1>
  <p class="subtitle">Enjoy five beautiful images</p>

  <div class="slideshow">
    <img id="mainImage" class="main-image"
      src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1400"
      alt="Mountain landscape">

    <button class="arrow prev" onclick="changeImage(-1)">
      &#10094;
    </button>

    <button class="arrow next" onclick="changeImage(1)">
      &#10095;
    </button>
  </div>

  <div class="dots" id="dots"></div>

  <button class="play-button" id="playButton"
    onclick="toggleSlideshow()">
    ▶ Play
  </button>

  <div class="thumbnails" id="thumbnails"></div>

  <script>
    const images = [
      {
        url: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1400",
        alt: "Mountain landscape"
      },
      {
        url: "https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1400",
        alt: "Waterfall"
      },
      {
        url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1400",
        alt: "Beach at sunset"
      },
      {
        url: "https://images.unsplash.com/photo-1448375240586-882707db888b?w=1400",
        alt: "Green forest"
      },
      {
        url: "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1400",
        alt: "City at night"
      }
    ];

    let currentIndex = 0;
    let playing = false;
    let timer = null;

    const mainImage = document.getElementById("mainImage");
    const dotsContainer = document.getElementById("dots");
    const thumbnailsContainer =
      document.getElementById("thumbnails");
    const playButton = document.getElementById("playButton");

    // Create the five dots and thumbnails
    images.forEach((image, index) => {
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.onclick = () => showImage(index);
      dotsContainer.appendChild(dot);

      const thumbnail = document.createElement("img");
      thumbnail.src = image.url;
      thumbnail.alt = image.alt;
      thumbnail.className = "thumbnail";
      thumbnail.onclick = () => showImage(index);
      thumbnailsContainer.appendChild(thumbnail);
    });

    const dots = document.querySelectorAll(".dot");
    const thumbnails =
      document.querySelectorAll(".thumbnail");

    // Display a selected image
    function showImage(index) {
      currentIndex = (index + images.length) % images.length;

      mainImage.src = images[currentIndex].url;
      mainImage.alt = images[currentIndex].alt;

      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === currentIndex);
      });

      thumbnails.forEach((thumbnail, i) => {
        thumbnail.classList.toggle(
          "active", i === currentIndex
        );
      });
    }

    // Move forward or backward
    function changeImage(direction) {
      showImage(currentIndex + direction);
    }

    // Automatically change images every 3 seconds
    function toggleSlideshow() {
      if (playing) {
        clearInterval(timer);
        playing = false;
        playButton.textContent = "▶ Play";
      } else {
        playing = true;
        playButton.textContent = "⏸ Pause";

        timer = setInterval(() => {
          changeImage(1);
        }, 428);
      }
    }

    // Show the first image on startup
    showImage(0);
    toggleSlideshow();
  </script>

</body>
</html>
